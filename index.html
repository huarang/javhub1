<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JavHub - Películas JAV Hot, Censored y Uncensored en HD</title>
    <meta name="description" content="Disfruta del contenido más caliente y exclusivo de JAV en tu celular. Actrices hermosas, masajes sensuales y videos en máxima calidad HD totalmente gratis en JavHub.">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            -webkit-tap-highlight-color: transparent;
        }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .neon-glow {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.35);
        }
        /* Scrollbar personalizado moderno cian/morado */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- JuicyAds PopUnders v3 Start -->
    <script type="text/javascript" src="https://js.juicyads.com/jp.php?c=4474x2v2q224u4r2p2c443a4a4&u=https%3A%2F%2Fwww.juicyads.rocks"></script>
    <!-- JuicyAds PopUnders v3 End -->  
    
    <!-- HEADER / NAVEGACIÓN -->
    <header class="bg-zinc-950 border-b border-purple-500/20 sticky top-0 z-50 backdrop-blur-md bg-opacity-90 shadow-2xl">
        <div class="max-w-[1600px] mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            <a href="?" class="text-2xl font-black tracking-wider text-purple-400 flex items-center gap-1">
                JAV<span class="text-cyan-400">HUB</span><span class="text-[10px] bg-purple-600 text-white px-2 py-0.5 rounded-md uppercase ml-1 shadow-lg shadow-purple-500/50">PRO ⚡</span>
            </a>
            
            <div class="w-full md:w-1/3 relative">
                <input type="text" id="searchInput" placeholder="⚡ Buscar actrices, tags, categorías..." 
                    class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-cyan-400 transition shadow-inner">
            </div>
            
            <div id="counter" class="text-xs text-cyan-300 font-bold bg-purple-950/40 px-3 py-1.5 rounded-xl border border-purple-800/40">Cargando catálogo masivo...</div>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE 3 COLUMNAS -->
    <div class="max-w-[1600px] mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- SIDEBAR IZQUIERDA -->
        <aside class="hidden lg:block lg:col-span-2 space-y-4 sticky top-20">
            <div id="leftSidebarAd" class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-center min-h-[400px] flex flex-col justify-center items-center text-zinc-500 text-xs border-dashed">
                <!-- Se inyecta automáticamente desde la variable AD_LEFT_BANNER -->
            </div>
        </aside>

        <!-- CONTENIDO CENTRAL -->
        <main class="col-span-1 lg:col-span-8 w-full space-y-6">
            
            <!-- SECCIÓN DE CATEGORÍAS RÁPIDAS -->
            <div class="bg-zinc-950 border border-zinc-800/80 p-4 rounded-xl shadow-lg">
                <h3 class="text-xs font-bold text-purple-400 uppercase tracking-wider mb-3">Categorías Destacadas</h3>
                <div id="categoriesContainer" class="flex flex-wrap gap-2">
                    <!-- Se inyectan dinámicamente -->
                </div>
            </div>

            <!-- SECCIÓN: GRID DE VIDEOS -->
            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base md:text-lg font-black text-white flex items-center gap-2">
                        ⚡ <span id="sectionTitle">Catálogo Completo</span>
                    </h2>
                    <div id="activeFilterBadge" class="hidden text-xs bg-purple-950 text-purple-300 px-3 py-1 rounded-xl border border-purple-800/60 flex items-center gap-2">
                        Filtrando por: <span id="filterName" class="font-bold"></span>
                        <button onclick="clearFilter()" class="hover:text-white font-bold">&times;</button>
                    </div>
                </div>

                <div id="videoGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    <!-- Tarjetas de video -->
                </div>

                <div id="statusMessage" class="text-center py-20 text-zinc-500 text-sm">
                    Sincronizando base de datos de 60k+ videos... Esto puede tomar unos segundos.
                </div>

                <!-- PAGINACIÓN -->
                <div id="paginationContainer" class="flex justify-center items-center gap-2 mt-8 hidden">
                    <button onclick="changePage(currentPage - 1)" id="prevBtn" class="bg-zinc-900 border border-zinc-800 text-white px-4 py-2 rounded-xl text-xs font-bold hover:border-purple-500 transition disabled:opacity-30">Anterior</button>
                    <span id="pageInfo" class="text-xs text-zinc-400 font-mono px-3">Página 1 de 1</span>
                    <button onclick="changePage(currentPage + 1)" id="nextBtn" class="bg-zinc-900 border border-zinc-800 text-white px-4 py-2 rounded-xl text-xs font-bold hover:border-purple-500 transition disabled:opacity-30">Siguiente</button>
                </div>
            </section>
        </main>

        <!-- SIDEBAR DERECHA -->
        <aside class="hidden lg:block lg:col-span-2 space-y-4 sticky top-20">
            <div id="rightSidebarAd" class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-center min-h-[400px] flex flex-col justify-center items-center text-zinc-500 text-xs border-dashed">
                <!-- Se inyecta automáticamente desde la variable AD_RIGHT_BANNER -->
            </div>
        </aside>

    </div>

    <!-- MODAL REPRODUCTOR AMPLIADO -->
    <div id="videoModal" class="fixed inset-0 bg-black/95 z-50 hidden flex items-center justify-center p-0 sm:p-6 backdrop-blur-lg overflow-y-auto">
        <div class="bg-zinc-950 border-0 sm:border border-purple-500/40 w-full max-w-6xl sm:rounded-2xl overflow-hidden shadow-2xl relative flex flex-col neon-glow my-auto">
            
            <div class="flex justify-between items-center px-4 py-3 sm:px-6 sm:py-4 bg-zinc-900 border-b border-zinc-800">
                <h3 id="modalTitle" class="font-bold text-xs sm:text-base text-white truncate pr-4">Reproduciendo</h3>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-cyan-400 text-3xl font-bold px-2 transition">&times;</button>
            </div>

            <!-- BANNER SUPERIOR DEL MODAL -->
            <div id="modalTopAd">
                <!-- Se inyecta automáticamente desde la variable AD_MODAL_TOP -->
            </div>

            <!-- Contenedor Principal del Reproductor + Similares -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 p-4 bg-black">
                <!-- Video principal -->
                <div class="lg:col-span-8 flex flex-col justify-center">
                    <div class="relative w-full aspect-video bg-black flex items-center justify-center rounded-xl overflow-hidden shadow-2xl border border-zinc-900">
                        <iframe id="modalIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
                    </div>
                </div>

                <!-- Columna de Videos Similares -->
                <div class="lg:col-span-4 flex flex-col space-y-3 max-h-[450px] overflow-y-auto pr-1">
                    <h4 class="text-xs font-bold text-cyan-400 uppercase tracking-wider sticky top-0 bg-black py-1">⚡ Videos Recomendados</h4>
                    <div id="similarVideosContainer" class="space-y-2.5">
                        <!-- Se cargan dinámicamente -->
                    </div>
                </div>
            </div>

            <!-- BANNER INFERIOR DEL MODAL -->
            <div id="modalBottomAd" class="bg-zinc-900 p-3 sm:p-4 border-t border-zinc-800 flex flex-col sm:flex-row justify-between items-center gap-2">
                <!-- Se inyecta automáticamente desde la variable AD_MODAL_BOTTOM -->
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-zinc-950 border-t border-zinc-900 text-center py-5 text-zinc-500 text-xs">
        JavHub Pro &bull; Contenido exclusivo para mayores de edad (+18)
    </footer>

    <!-- SCRIPT DE CONFIGURACIÓN DE ANUNCIOS Y CATALOGO -->
    <script>
        const AD_LEFT_BANNER = `
            <span class="text-purple-400 font-bold mb-1">PUBLICIDAD</span>
            <p>Pega aquí tu código HTML o script de AdMaven / Clickadilla</p>
        `;

        const AD_RIGHT_BANNER = `
            <span class="text-purple-400 font-bold mb-1">PUBLICIDAD</span>
            <p>Pega aquí tu código HTML o script de AdMaven / Clickadilla</p>
        `;

        const AD_MODAL_TOP = `
            <div class="bg-zinc-900/90 px-4 py-1.5 border-b border-zinc-800 flex justify-between items-center text-[11px] text-zinc-400">
                <span>⚡ Reproducción HD Prioritaria</span>
                <span class="text-cyan-400 font-semibold cursor-pointer hover:underline" onclick="alert('Acción de anuncio superior')">Patrocinado ⭐</span>
            </div>
        `;

        const AD_MODAL_BOTTOM = `
            <div class="w-full sm:w-auto text-center sm:text-left text-[11px] text-zinc-400 bg-zinc-950 border border-zinc-800 px-3 py-1.5 rounded-xl">
                ⚡ ¿Quieres ver más contenido exclusivo sin anuncios? <span class="text-cyan-400 font-bold underline cursor-pointer">Clic aquí</span>
            </div>
            <button onclick="shareVideo()" class="w-full sm:w-auto bg-gradient-to-r from-purple-600 to-cyan-600 hover:from-purple-500 hover:to-cyan-500 text-white px-4 py-2 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-purple-600/30 whitespace-nowrap">Copiar Enlace</button>
        `;

        document.getElementById('leftSidebarAd').innerHTML = AD_LEFT_BANNER;
        document.getElementById('rightSidebarAd').innerHTML = AD_RIGHT_BANNER;
        document.getElementById('modalTopAd').innerHTML = AD_MODAL_TOP;
        document.getElementById('modalBottomAd').innerHTML = AD_MODAL_BOTTOM;

        const jsonlUrl = 'https://huarang.github.io/vjav-data/vjav_videos.jsonl';
        
        let allVideos = [];
        let filteredVideos = [];
        let currentPage = 1;
        const itemsPerPage = 48;

        const videoGrid = document.getElementById('videoGrid');
        const searchInput = document.getElementById('searchInput');
        const counter = document.getElementById('counter');
        const statusMessage = document.getElementById('statusMessage');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const paginationContainer = document.getElementById('paginationContainer');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        const videoModal = document.getElementById('videoModal');
        const modalIframe = document.getElementById('modalIframe');
        const modalTitle = document.getElementById('modalTitle');
        const activeFilterBadge = document.getElementById('activeFilterBadge');
        const filterName = document.getElementById('filterName');
        const similarVideosContainer = document.getElementById('similarVideosContainer');

        function slugify(text) {
            return text.toString().toLowerCase()
                .replace(/\s+/g, '-')
                .replace(/[^\w\-]+/g, '')
                .replace(/\-\-+/g, '-')
                .trim();
        }

        function formatDuration(seconds) {
            const sec = parseInt(seconds, 10);
            if (isNaN(sec)) return "00:00";
            const mins = Math.floor(sec / 60);
            const remainingSecs = sec % 60;
            return `${mins}:${remainingSecs < 10 ? '0' : ''}${remainingSecs}`;
        }

        async function fetchJSONL() {
            try {
                const response = await fetch(jsonlUrl);
                if (!response.ok) throw new Error('Error al conectar con el servidor');
                
                const text = await response.text();
                const lines = text.split('\n');
                
                allVideos = [];
                for (let line of lines) {
                    if (line.trim() !== '') {
                        try {
                            allVideos.push(JSON.parse(line));
                        } catch (e) {}
                    }
                }

                filteredVideos = allVideos;
                statusMessage.style.display = 'none';
                paginationContainer.classList.remove('hidden');
                counter.textContent = `⚡ ${allVideos.length.toLocaleString()} Videos Totales`;

                extractTopCategories();
                renderCurrentPage();
                checkUrlParameter();

            } catch (error) {
                statusMessage.textContent = 'Error al conectar con el servidor. Intenta recargar la página.';
                console.error(error);
            }
        }

        function extractTopCategories() {
            const counts = {};
            allVideos.forEach(v => {
                if (v.categories) {
                    v.categories.forEach(cat => {
                        counts[cat] = (counts[cat] || 0) + 1;
                    });
                }
            });

            const topCats = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).slice(0, 15);

            categoriesContainer.innerHTML = '';
            topCats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'bg-zinc-900 hover:bg-purple-600 hover:text-white text-zinc-300 text-xs px-3 py-1.5 rounded-xl transition border border-zinc-800 font-medium';
                btn.textContent = `${cat} (${counts[cat]})`;
                btn.onclick = () => filterByCategory(cat);
                categoriesContainer.appendChild(btn);
            });
        }

        function renderCurrentPage() {
            videoGrid.innerHTML = '';

            if (filteredVideos.length === 0) {
                statusMessage.textContent = 'No se encontraron resultados con ese criterio.';
                statusMessage.style.display = 'block';
                paginationContainer.classList.add('hidden');
                return;
            } else {
                statusMessage.style.display = 'none';
                paginationContainer.classList.remove('hidden');
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredVideos.slice(startIndex, endIndex);

            pageItems.forEach(video => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-950 border border-zinc-800/80 rounded-xl overflow-hidden shadow-lg transition duration-300 flex flex-col justify-between group hover:border-purple-500/60 hover:shadow-purple-500/10';
                
                const primaryCat = video.categories && video.categories.length > 0 ? video.categories[0] : 'JAV';
                const hasHd = video.tags && video.tags.some(t => t.toLowerCase().includes('hd')) ? '• HD' : '';
                const videoSlug = slugify(video.title);

                card.innerHTML = `
                    <div>
                        <div class="relative aspect-video overflow-hidden bg-zinc-900 cursor-pointer" onclick="selectVideo('${video.id}', '${videoSlug}')">
                            <img src="${video.poster}" alt="${video.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute bottom-2 right-2 bg-black/80 text-cyan-400 text-[10px] px-1.5 py-0.5 rounded font-mono font-bold">${formatDuration(video.duration)}</span>
                            <div class="absolute inset-0 bg-purple-600/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <div class="bg-gradient-to-r from-purple-600 to-cyan-500 text-white p-2.5 rounded-full shadow-lg">
                                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </div>
                            </div>
                        </div>
                        <div class="p-3">
                            <h2 class="font-semibold text-xs text-zinc-100 line-clamp-2 hover:text-cyan-400 transition cursor-pointer mb-1" onclick="selectVideo('${video.id}', '${videoSlug}')">${video.title}</h2>
                            <p class="text-[10px] text-zinc-400 font-medium">${primaryCat} ${hasHd}</p>
                        </div>
                    </div>
                `;
                videoGrid.appendChild(card);
            });

            const totalPages = Math.ceil(filteredVideos.length / itemsPerPage);
            pageInfo.textContent = `Página ${currentPage} de ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage >= totalPages;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(targetPage) {
            currentPage = targetPage;
            renderCurrentPage();
        }

        function filterByCategory(cat) {
            currentPage = 1;
            filteredVideos = allVideos.filter(v => v.categories && v.categories.includes(cat));
            filterName.textContent = cat;
            activeFilterBadge.classList.remove('hidden');
            renderCurrentPage();
        }

        function clearFilter() {
            currentPage = 1;
            filteredVideos = allVideos;
            activeFilterBadge.classList.add('hidden');
            searchInput.value = '';
            renderCurrentPage();
        }

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            currentPage = 1;
            filteredVideos = allVideos.filter(video => {
                const titleMatch = video.title.toLowerCase().includes(term);
                const catMatch = video.categories && video.categories.some(c => c.toLowerCase().includes(term));
                const tagMatch = video.tags && video.tags.some(t => t.toLowerCase().includes(term));
                return titleMatch || catMatch || tagMatch;
            });
            renderCurrentPage();
        });

        function selectVideo(id, slug) {
            const video = allVideos.find(v => v.id === id);
            if (!video) return;

            const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?v=${slug}-${id}`;
            window.history.pushState({path: newurl}, '', newurl);

            openModal(video);
        }

        function checkUrlParameter() {
            const urlParams = new URLSearchParams(window.location.search);
            const vParam = urlParams.get('v');
            if (vParam) {
                const found = allVideos.find(v => v.id === vParam || vParam.endsWith('-' + v.id));
                if (found) {
                    openModal(found);
                }
            }
        }

        function openModal(video) {
            modalTitle.textContent = video.title;
            modalIframe.src = video.iframe;
            videoModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            renderSimilarVideos(video);
        }

        function renderSimilarVideos(currentVideo) {
            similarVideosContainer.innerHTML = '';
            
            let similars = allVideos.filter(v => v.id !== currentVideo.id && v.categories && currentVideo.categories && v.categories.some(c => currentVideo.categories.includes(c)));
            
            if (similars.length < 8) {
                const others = allVideos.filter(v => v.id !== currentVideo.id && !similars.includes(v));
                similars = similars.concat(others);
            }

            similars.slice(0, 12).forEach(sim => {
                const itemSlug = slugify(sim.title);
                const simCard = document.createElement('div');
                simCard.className = 'flex gap-2 bg-zinc-900 hover:bg-zinc-800 p-1.5 rounded-xl cursor-pointer transition border border-zinc-800/80';
                simCard.onclick = () => {
                    const newurl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?v=${itemSlug}-${sim.id}`;
                    window.history.pushState({path: newurl}, '', newurl);
                    openModal(sim);
                };

                simCard.innerHTML = `
                    <div class="relative w-28 aspect-video bg-black rounded-lg overflow-hidden flex-shrink-0">
                        <img src="${sim.poster}" alt="${sim.title}" class="w-full h-full object-cover" loading="lazy">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-cyan-400 text-[9px] px-1 rounded font-mono">${formatDuration(sim.duration)}</span>
                    </div>
                    <div class="flex flex-col justify-center overflow-hidden pr-1">
                        <h5 class="text-[11px] font-semibold text-zinc-200 line-clamp-2 leading-tight hover:text-cyan-400">${sim.title}</h5>
                        <span class="text-[9px] text-zinc-400 mt-1">${sim.categories ? sim.categories[0] : 'JAV'}</span>
                    </div>
                `;
                similarVideosContainer.appendChild(simCard);
            });
        }

        function closeModal() {
            modalIframe.src = '';
            videoModal.classList.add('hidden');
            document.body.style.overflow = 'auto';

            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path: cleanUrl}, '', cleanUrl);
        }

        function shareVideo() {
            navigator.clipboard.writeText(window.location.href);
            alert('¡Enlace directo copiado al portapapeles!');
        }

        window.addEventListener('popstate', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (!urlParams.has('v')) {
                closeModal();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        fetchJSONL();
    </script>
</body>
</html>
